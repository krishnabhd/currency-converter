    <!DOCTYPE html>
    <html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script src="https://cdn.tailwindcss.com"></script>
        <title>Currency Converter</title>
    </head>

    <body class="min-h-screen bg-slate-100 flex items-center justify-center p-4">

        <div class="w-full max-w-md rounded-2xl bg-white p-6 shadow-xl ring-1 ring-slate-200">
            <h2 class="mb-6 text-center text-3xl font-bold text-slate-800">Currency Converter</h2>

            <div class="mb-5">
                <form action="" class="space-y-3">
                    <label class="block text-sm font-medium text-slate-600">Enter Amount</label>
                    <input id="amount" type="number" value="1"
                        class="w-full rounded-lg border border-slate-300 bg-slate-50 px-4 py-3 text-lg text-slate-800 outline-none transition focus:border-blue-500 focus:bg-white">
                </form>
            </div>

            <div class="mb-5 flex gap-12 ml-8">
                <div class="from flex items-center gap-3 rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 ">

                    <img src="" id="fromImg" alt=""
                        class="block px-1 h-10 rounded-lg object-cover bg-slate-200  border-slate-200">
                    <select id="fromCurrency" class="w-full appearance-none bg-transparent text-slate-700 outline-none">

                    </select>
                </div>

                <h2 class="mt-3">➡️</h2>

                <div class="to flex items-center gap-3 rounded-xl border border-slate-200 bg-slate-50 px-3 py-2">
                    <img src="https://flagsapi.com/IN/flat/64.png" id="toImg" alt=""
                        class="block px-1 h-10 rounded-lg object-cover bg-slate-200  border-slate-200">
                    <select id="toCurrency" class="w-full appearance-none bg-transparent text-slate-700 outline-none">
                    </select>
                </div>
            </div>

            <div class="btn">
                <button id="convertBtn" type="button"
                    class="w-full rounded-xl bg-blue-600 px-4 py-3 text-base font-semibold text-white shadow-md transition hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-300">Get
                    Exchange Rate</button>
            </div>

            <div class="msg mt-5 rounded-xl bg-blue-50 px-4 py-3 text-center">
                <h3 id="result" class="text-lg font-semibold text-blue-700">1 USD = 94.25 INR</h3>
            </div>
        </div>

        <script src="codes.js"></script>
        <script src="script.js"></script>
    </body>

    </html>
